[package]
name = "memoryling"
version = "0.7.0"
description = "A local-first desktop creature that grows from AI agent memories"
authors = ["Memoryling contributors"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "memoryling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sha2 = "0.11.0"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
iana-time-zone = "0.1.65"
keyring-core = "1.0.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
tauri = { version = "2", features = ["test", "tray-icon"] }
